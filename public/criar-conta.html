<!doctype html>
<!-- Arquivo HTML: criar-conta.html | Estrutura e conteúdo da página correspondente. -->
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Conta - PetConecta</title>
    <link rel="stylesheet" href="css/buttons-global.css" />
    <link rel="stylesheet" href="css/guide-primeira-visita.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      body {
        flex: 1;
        background-image: url("assets/img/dia do pet.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }

      form {
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      footer {
        background-color: #ff914d;
        color: white;
        padding: 30px 0;
        font-family: "Segoe UI", sans-serif;
        margin-top: auto;
      }

      form h2 {
        margin-bottom: 20px;
        text-align: center;
        color: #333;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button[type="submit"] {
        width: 100%;
        padding: 12px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button[type="submit"]:hover {
        background-color: #45a049;
      }

      /* Estilo para o novo botão do Google */
      #btn-google {
        width: 100%;
        padding: 12px;
        background-color: #db4437;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      #btn-google:hover {
        background-color: #c23321;
      }
    </style>
    <link rel="stylesheet" href="css/buttons-global.css" />
  </head>
  <body data-guide-page="cadastro">
    <header id="cabeca">
      <h1 id="logo">🐾 PetConecta</h1>
      <nav id="nav-menu">
        <button
          id="btn-mobile"
          aria-label="Abrir Menu"
          aria-expanded="false"
          aria-controls="menu"
        >
          Menu
          <span id="hamburguer"></span>
        </button>
        <ul id="menu">
          <li><a href="index.html">Página Inicial</a></li>
          <li><a href="animais_encontra.html">Encontrados</a></li>
          <li>
            <a
              href="https://www.anjosdajuda.org/adote"
              target="_blank"
              rel="noopener noreferrer"
              >Adoção</a
            >
          </li>
          <li><a href="dicas.html">Cuidados</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <div>
      <form id="form-cadastro">
        <h2>Criar Conta</h2>
        <!-- Alterado de Usuário para E-mail para ser compatível com Firebase tradicional -->
        <label for="usuario">E-mail:</label>
        <input
          type="email"
          id="usuario"
          placeholder="seuemail@exemplo.com"
          required
        />

        <label for="senha">Senha:</label>
        <input
          type="password"
          id="senha"
          autocomplete="current-password"
          required
        />

        <button type="submit" id="btn-submit">Cadastrar</button>

        <p style="text-align: center; margin-top: 10px">
          <a
            href="#"
            id="toggle-mode"
            style="color: #4caf50; text-decoration: none; font-weight: bold"
            >Já tem conta? Fazer Login</a
          >
        </p>

        <!-- NOVO: Botão de Login com Google -->
        <button type="button" id="btn-google">
          <svg style="width: 18px; height: 18px" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M12.24 10.285V13.4h6.887C18.2 15.614 15.645 18 12.24 18c-3.86 0-7-3.14-7-7s3.14-7 7-7c1.71 0 3.27.61 4.5 1.625l2.437-2.437C17.312 1.696 14.933 1 12.24 1c-6.077 0-11 4.923-11 11s4.923 11 11 11c5.82 0 10.745-4.14 10.745-11 0-.69-.075-1.357-.21-1.715H12.24z"
            />
          </svg>
          Entrar com o Google
        </button>
      </form>
    </div>

    <footer class="site-footer">
      <div class="footer-content">
        <h3>🐶 PetConecta</h3>
        <p>Conectando pets incríveis a lares amorosos 💕</p>
        <div class="social-links">
          <a
            href="javascript:void(0)"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <img src="assets/img/icon-instagram.svg" alt="Instagram" />
          </a>
          <a
            href="https://www.facebook.com/seuusuario"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <img src="assets/img/icon-facebook.svg" alt="Facebook" />
          </a>
        </div>
        <nav class="footer-nav">
          <a href="index.html">Página Inicial</a>
          <a href="adocao.html">Adoção</a>
          <a href="dicas.html">Cuidados</a>
          <a href="contato.html">Contato</a>
        </nav>
        <p class="copyright">
          © 2026 PetConecta. Todos os direitos reservados.
        </p>
      </div>
    </footer>

    <script src="script/guide-primeira-visita.js" defer></script>

    <!-- Firebase Script Modificado -->
    <script type="module">
      import { auth } from "./script/firebase.js";
      import {
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        signInWithRedirect,
        getRedirectResult,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

      const provider = new GoogleAuthProvider();

      onAuthStateChanged(auth, (usuario) => {
        const authInProgress = sessionStorage.getItem(
          "petconectaAuthInProgress",
        );

        if (usuario && !authInProgress) {
          window.location.href = "index.html";
        }
      });

      // Função de tratamento de redirecionamento após autenticação.
      // Primeiro cadastro segue para publicação; usuário existente volta para a home.
      function redirecionarUsuario(destinoPadrao) {
        const destino =
          localStorage.getItem("destinoAposLogin") || destinoPadrao;
        localStorage.removeItem("destinoAposLogin");
        sessionStorage.removeItem("petconectaAuthInProgress");
        window.location.href = destino;
      }

      function destinoDepoisDoLogin(isNovoUsuario) {
        return isNovoUsuario ? "publicar.html" : "index.html";
      }

      // --- TRATAR RETORNO DO REDIRECIONAMENTO (MOBILE) ---
      // Executa ao carregar a página para verificar se o usuário voltou do login do Google no celular
      getRedirectResult(auth)
        .then((resultado) => {
          if (resultado) {
            const usuario = resultado.user;
            const isNovoUsuario =
              resultado.additionalUserInfo?.isNewUser ?? false;
            alert(`Bem-vindo ao PetConecta, ${usuario.displayName}!`);
            localStorage.setItem(
              "usuarioLogado",
              JSON.stringify({ usuario: usuario.email }),
            );
            redirecionarUsuario(destinoDepoisDoLogin(isNovoUsuario));
          }
        })
        .catch((error) => {
          console.error("Erro ao recuperar login do Google:", error);
          alert("Erro ao concluir login: " + error.message);
        });

      let isLoginMode = false;
      const toggleModeBtn = document.getElementById("toggle-mode");
      const formTitle = document.querySelector("#form-cadastro h2");
      const btnSubmit = document.getElementById("btn-submit");

      if (toggleModeBtn) {
        toggleModeBtn.addEventListener("click", (e) => {
          e.preventDefault();
          isLoginMode = !isLoginMode;
          if (isLoginMode) {
            formTitle.textContent = "Entrar";
            btnSubmit.textContent = "Entrar";
            toggleModeBtn.textContent = "Não tem conta? Cadastre-se";
          } else {
            formTitle.textContent = "Criar Conta";
            btnSubmit.textContent = "Cadastrar";
            toggleModeBtn.textContent = "Já tem conta? Fazer Login";
          }
        });
      }

      // --- REGISTRO TRADICIONAL (E-mail e Senha) ---
      const form = document.getElementById("form-cadastro");
      if (form) {
        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document.getElementById("usuario")?.value.trim();
          const senha = document.getElementById("senha")?.value.trim();

          if (!email || !senha) {
            alert("Preencha todos os campos obrigatórios.");
            return;
          }

          try {
            sessionStorage.setItem("petconectaAuthInProgress", "true");

            if (isLoginMode) {
              await signInWithEmailAndPassword(auth, email, senha);
              alert("Login realizado com sucesso!");
              localStorage.setItem(
                "usuarioLogado",
                JSON.stringify({ usuario: email }),
              );
              redirecionarUsuario("index.html");
            } else {
              await createUserWithEmailAndPassword(auth, email, senha);
              alert("Conta criada com sucesso!");
              localStorage.setItem(
                "usuarioLogado",
                JSON.stringify({ usuario: email }),
              );
              redirecionarUsuario("publicar.html");
            }
          } catch (error) {
            console.error("Erro na autenticação:", error);
            if (error.code === "auth/email-already-in-use") {
              alert("Este e-mail já está em uso. Tente fazer login.");
            } else if (error.code === "auth/invalid-credential") {
              alert("E-mail ou senha inválidos.");
            } else {
              alert("Erro: " + error.message);
            }
          }
        });
      }

      // --- REGISTRO / LOGIN COM GOOGLE (HÍBRIDO MOBILE/DESKTOP) ---
      const btnGoogle = document.getElementById("btn-google");
      if (btnGoogle) {
        btnGoogle.addEventListener("click", async function () {
          try {
            // Detecta se o usuário está em um dispositivo móvel
            const isMobile =
              /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
                navigator.userAgent,
              );

            if (isMobile) {
              // No celular, redireciona (evita pop-up bloqueado)
              await signInWithRedirect(auth, provider);
            } else {
              // No computador, abre o pop-up nativo normalmente
              const resultado = await signInWithPopup(auth, provider);
              const usuario = resultado.user;
              const isNovoUsuario =
                resultado.additionalUserInfo?.isNewUser ?? false;
              alert(`Bem-vindo ao PetConecta, ${usuario.displayName}!`);
              localStorage.setItem(
                "usuarioLogado",
                JSON.stringify({ usuario: usuario.email }),
              );
              redirecionarUsuario(destinoDepoisDoLogin(isNovoUsuario));
            }
          } catch (error) {
            console.error("Erro no login com Google:", error);
            alert("Erro ao fazer login com o Google: " + error.message);
          }
        });
      }
    </script>
    <script>
      const btnMobile = document.querySelector("#btn-mobile");
      const navMenu = document.querySelector("#nav-menu");
      const menuLinks = document.querySelectorAll("#menu a");

      if (btnMobile) {
        btnMobile.addEventListener("click", () => {
          navMenu.classList.toggle("active");
          const isOpen = navMenu.classList.contains("active");
          btnMobile.setAttribute("aria-expanded", String(isOpen));
        });
      }

      menuLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navMenu.classList.remove("active");
          btnMobile?.setAttribute("aria-expanded", "false");
        });
      });
    </script>
  </body>
</html>
