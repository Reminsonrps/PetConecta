<!doctype html>
<!-- Arquivo HTML: detalhes.html | Estrutura e conteúdo da página correspondente. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do Pet - PetConecta</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/detalhes.css" />
    <link rel="stylesheet" href="css/buttons-global.css" />
  </head>
  <body>
    <header id="cabeca">
      <h1 id="logo">🐾 PetConecta</h1>

      <nav id="nav-menu">
        <button
          id="btn-mobile"
          aria-label="Abrir Menu"
          aria-expanded="false"
          aria-controls="menu"
        >
          Menu
          <span id="hamburguer"></span>
        </button>
        <!-- Este menu será sincronizado dinamicamente pelo Firebase Auth -->
        <ul id="menu">
          <li><a href="index.html">Página Inicial</a></li>
          <li><a href="animais_encontra.html">Encontrados</a></li>
          <li>
            <a
              href="https://www.anjosdajuda.org/adote"
              target="_blank"
              rel="noopener noreferrer"
              >Adoção</a
            >
          </li>
          <li><a href="dicas.html">Cuidados</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Detalhes principais do pet -->
      <div class="detalhes-container" id="detalhesPet">
        <!-- Conteúdo será inserido via JavaScript do Firebase -->
      </div>

      <!-- Formulário de Registro de Avistamentos (Surgirá reativamente se o pet estiver perdido) -->
      <div
        class="detalhes-container"
        id="secao-avistamentos"
        style="
          margin-top: 30px;
          padding: 25px;
          display: none;
          box-sizing: border-box;
        "
      >
        <h3
          style="
            margin-top: 0;
            margin-bottom: 15px;
            color: #ff6600;
            font-family: &quot;Fredoka One&quot;, sans-serif;
          "
        >
          ⚠️ Viu este pet? Reporte um Avistamento!
        </h3>

        <form id="form-avistamento">
          <div style="margin-bottom: 15px">
            <label
              style="
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
                color: #555;
              "
              >Onde você o viu?</label
            >
            <input
              type="text"
              id="avistamento-local"
              placeholder="Ex: Próximo à praça central, rua X"
              required
              style="
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
              "
            />
          </div>

          <div style="margin-bottom: 15px">
            <label
              style="
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
                color: #555;
              "
              >Detalhes (ex: cor de coleira, se parecia assustado, direção que
              correu):</label
            >
            <textarea
              id="avistamento-descricao"
              rows="3"
              placeholder="Informações que ajudem o tutor a localizá-lo..."
              required
              style="
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
                font-family: sans-serif;
                resize: vertical;
              "
            ></textarea>
          </div>

          <div style="margin-bottom: 15px">
            <label
              style="
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
                color: #555;
              "
              >Seu E-mail ou Telefone para contato:</label
            >
            <input
              type="text"
              id="avistamento-contato"
              placeholder="Para que o tutor possa falar com você para mais detalhes"
              required
              style="
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
              "
            />
          </div>

          <button type="submit" id="btn-avistamento" style="width: 100%">
            Registrar Avistamento 🐾
          </button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <h3>🐶 PetConecta</h3>
        <p>Conectando pets incríveis a lares amorosos 💕</p>
        <div class="social-links">
          <a
            href="javascript:void(0)"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <img src="assets/img/icon-instagram.svg" alt="Instagram" />
          </a>
          <a
            href="https://www.facebook.com/seuusuario"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <img src="assets/img/icon-facebook.svg" alt="Facebook" />
          </a>
        </div>
        <nav class="footer-nav">
          <a href="index.html">Página Inicial</a>
          <a
            href="https://www.anjosdajuda.org/adote"
            target="_blank"
            rel="noopener noreferrer"
            >Adoção</a
          >
          <a href="dicas.html">Cuidados</a>
          <a href="contato.html">Contato</a>
        </nav>
        <p class="copyright">
          © 2026 PetConecta. Todos os direitos reservados.
        </p>
      </div>
    </footer>

    <!-- Script de animação do Navbar Mobile -->
    <script>
      const btnMobile = document.querySelector("#btn-mobile");
      const navMenu = document.querySelector("#nav-menu");
      const menuLinks = document.querySelectorAll("#menu a");

      function toggleMenu() {
        navMenu.classList.toggle("active");
        const isOpen = navMenu.classList.contains("active");
        btnMobile?.setAttribute("aria-expanded", String(isOpen));
      }

      if (btnMobile) {
        btnMobile.addEventListener("click", toggleMenu);
      }

      menuLinks.forEach((link) => {
        link.addEventListener("click", () => {
          navMenu.classList.remove("active");
          btnMobile?.setAttribute("aria-expanded", "false");
        });
      });
    </script>

    <!-- Script Modular do Firebase -->
    <script type="module">
      import { auth, db } from "./script/firebase.js";
      import {
        doc,
        getDoc,
        collection,
        addDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
      import {
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

      // --- MENU DE NAVEGAÇÃO DINÂMICO COM AUTH ---
      onAuthStateChanged(auth, (user) => {
        const menu = document.getElementById("menu");
        if (!menu) return;

        const linksBase = `
          <li><a href="index.html">Página Inicial</a></li>
          <li><a href="animais_encontra.html">Encontrados</a></li>
          <li><a href="https://www.anjosdajuda.org/adote" target="_blank" rel="noopener noreferrer">Adoção</a></li>
          <li><a href="dicas.html">Cuidados</a></li>
          <li><a href="contato.html">Contato</a></li>
        `;

        if (user) {
          const nomeExibicao = user.displayName || user.email.split("@")[0];

          menu.innerHTML = `
            ${linksBase}
            <li><a href="cadastrados.html">Meus Pets</a></li>
            <li><span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.55);color:#fff;font-weight:700;border-radius:20px;padding:5px 14px;font-size:0.9rem;">👤 ${nomeExibicao}</span></li>
            <li><a href="#" id="btn-logout" style="color: #ffccd5; font-weight: bold; text-decoration: none;">Sair</a></li>
          `;

          const btnLogout = document.getElementById("btn-logout");
          if (btnLogout) {
            btnLogout.addEventListener("click", (e) => {
              e.preventDefault();
              signOut(auth).then(() => {
                localStorage.removeItem("usuarioLogado");
                window.location.reload();
              });
            });
          }
        } else {
          menu.innerHTML = `
            ${linksBase}
            <li><a href="criar-conta.html" style="color: #4CAF50; font-weight: bold; text-decoration: none;">Entrar / Cadastrar</a></li>
          `;
        }
      });

      // --- BUSCA DETALHADA DO PET NO FIRESTORE ---
      const urlParams = new URLSearchParams(window.location.search);
      const petId = urlParams.get("id");
      const container = document.getElementById("detalhesPet");
      const secaoAvistamentos = document.getElementById("secao-avistamentos");
      let petAtual = null;

      async function carregarDetalhes() {
        if (!petId) {
          container.innerHTML = `
            <p style="text-align: center;">ID do pet inválido ou não informado. Volte à página anterior.</p>
            <a href="index.html" class="voltar-btn" style="display: block; margin: 10px auto; text-align: center; max-width: 150px;">← Voltar</a>
          `;
          return;
        }

        try {
          const docRef = doc(db, "pets", petId);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const pet = docSnap.data();
            petAtual = {
              id: petId,
              nome: pet.nome || "Pet",
              usuarioCriador: pet.usuarioCriador || "",
              ...pet,
            };
            const statusTexto =
              pet.status === "achado"
                ? "ENCONTRADO POR TERCEIROS - AGUARDANDO DEVOLUÇÃO"
                : pet.status?.toUpperCase() || "DESAPARECIDO";
            const statusColor =
              pet.status === "encontrado" ? "#4CAF50" : "#d97706";

            if (pet.status === "desaparecido") {
              secaoAvistamentos.style.display = "block";
            }

            const emailContato = pet.contato || "Não informado";
            const whatsappContato = pet.whatsapp || "";
            const whatsappNumero = whatsappContato.replace(/\D/g, "");

            container.innerHTML = `
              <article class="pet-detail-card">
                <div class="pet-image-wrapper">
                  <img src="${pet.imagem || "assets/img/adoção.jpg"}" alt="Imagem de ${pet.nome || "Pet"}" onerror="this.src='https://via.placeholder.com/300'">
                </div>

                <div class="pet-detail-body">
                  <span class="pet-status" style="background-color: ${statusColor};">${statusTexto}</span>
                  <h2>${pet.nome || "Sem nome"}</h2>
                  <p class="pet-description">${pet.descricao || "Sem descrição disponível."}</p>

                  <div class="pet-info-grid">
                    <div><strong>Tipo:</strong> ${pet.tipo || pet.raca || "Não informado"}</div>
                    <div><strong>Porte:</strong> ${pet.porte || "Não informado"}</div>
                    <div><strong>Sexo:</strong> ${pet.sexo || "Indefinido"}</div>
                    <div><strong>Idade:</strong> ${pet.idade || "Não informada"}</div>
                    <div><strong>Localização:</strong> ${pet.localiza || pet.localizacao || "Não informada"}</div>
                    <div><strong>Data:</strong> ${pet.data || "Não informada"}</div>
                  </div>

                  <div style="margin-top: 18px; padding: 14px 16px; border: 1px solid rgba(255,117,26,0.25); border-radius: 12px; background: #fffaf6;">
                    <p style="margin: 0 0 10px; font-weight: 700; color: #b85613;">Contato do anunciante</p>
                    <p style="margin: 0 0 12px; color: #51453d;">
                      Os dados de contato ficam protegidos para evitar exposição indevida. Revele somente quando houver interesse real em ajudar.
                    </p>

                    <button id="btn-revelar-contato" type="button" style="padding: 10px 16px; border: none; border-radius: 10px; background: linear-gradient(135deg, #ff751a 0%, #d85f13 100%); color: white; font-weight: 700; cursor: pointer;">
                      Revelar contato
                    </button>

                    <div id="contato-privado" style="display: none; margin-top: 14px;">
                      <p class="pet-contact" style="margin: 8px 0;"><strong>E-mail:</strong> ${emailContato}</p>

                      ${
                        whatsappNumero
                          ? `
                        <p class="pet-whatsapp" style="margin: 8px 0;">
                          <strong>WhatsApp:</strong>
                          <a href="https://wa.me/55${whatsappNumero}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; color: #25D366; font-weight: bold; display: inline-flex; align-items: center; gap: 5px;">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" style="width: 20px; height: 20px; vertical-align: middle;">
                            Falar no WhatsApp
                          </a>
                        </p>
                      `
                          : ""
                      }
                    </div>
                  </div>

                  <div class="pet-actions" style="margin-top: 20px;">
                    <a href="index.html" class="voltar-btn" style="text-decoration: none;">← Voltar</a>
                  </div>
                </div>
              </article>
            `;

            const btnRevelarContato = document.getElementById(
              "btn-revelar-contato",
            );
            const blocoContatoPrivado =
              document.getElementById("contato-privado");

            if (btnRevelarContato && blocoContatoPrivado) {
              btnRevelarContato.addEventListener("click", () => {
                const confirmar = window.confirm(
                  "Você está prestes a visualizar os dados de contato do anunciante. Use com responsabilidade e apenas para ajudar no resgate do pet.",
                );

                if (confirmar) {
                  blocoContatoPrivado.style.display = "block";
                  btnRevelarContato.textContent = "Contato revelado";
                  btnRevelarContato.disabled = true;
                }
              });
            }
          } else {
            container.innerHTML = `
              <p style="text-align: center;">Pet não encontrado. Volte à página anterior e tente novamente.</p>
              <a href="index.html" class="voltar-btn" style="display: block; margin: 10px auto; text-align: center; max-width: 150px;">← Voltar</a>
            `;
          }
        } catch (error) {
          console.error("Erro ao buscar detalhes no Firestore:", error);
          container.innerHTML = `
            <p style="text-align: center;">Ocorreu um erro ao carregar as informações do pet. Tente novamente mais tarde.</p>
            <a href="index.html" class="voltar-btn" style="display: block; margin: 10px auto; text-align: center; max-width: 150px;">← Voltar</a>
          `;
        }
      }

      // --- SALVAR AVISTAMENTO ---
      const formAvistamento = document.getElementById("form-avistamento");
      const btnAvistamento = document.getElementById("btn-avistamento");

      if (formAvistamento) {
        formAvistamento.addEventListener("submit", async (e) => {
          e.preventDefault();

          btnAvistamento.disabled = true;
          btnAvistamento.textContent = "Registrando avistamento... 🐾";

          const local = document
            .getElementById("avistamento-local")
            .value.trim();
          const descricao = document
            .getElementById("avistamento-descricao")
            .value.trim();
          const contato = document
            .getElementById("avistamento-contato")
            .value.trim();

          try {
            const avistamentosRef = collection(
              db,
              "pets",
              petId,
              "avistamentos",
            );
            await addDoc(avistamentosRef, {
              localAvistado: local,
              descricao: descricao,
              contatoReportador: contato,
              petId: petAtual?.id || petId,
              petNome: petAtual?.nome || "Pet",
              petOwnerEmail: petAtual?.usuarioCriador || "",
              reportadoPor: auth.currentUser?.email || "",
              dataRegistro: serverTimestamp(),
            });

            alert(
              "Avistamento registrado com sucesso! O tutor do pet verá essa informação na página 'Meus Pets'. ❤️",
            );
            formAvistamento.reset();
          } catch (error) {
            console.error("Erro ao registrar avistamento no Firestore:", error);
            alert(
              "Não foi possível registrar o avistamento. Verifique sua conexão e tente novamente.",
            );
          } finally {
            btnAvistamento.disabled = false;
            btnAvistamento.textContent = "Registrar Avistamento 🐾";
          }
        });
      }

      carregarDetalhes();
    </script>
  </body>
</html>
