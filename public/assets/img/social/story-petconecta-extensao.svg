<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Teste o PetConecta</title>
  <desc id="desc">Cartaz vertical do projeto de extensão universitária PetConecta com QR code.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f26b21"/>
      <stop offset="0.6" stop-color="#ff9b4a"/>
      <stop offset="1" stop-color="#ffd3a4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#9b3d0a" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#background)"/>
  <circle cx="80" cy="180" r="220" fill="#fff" opacity="0.14"/>
  <circle cx="1030" cy="440" r="180" fill="#fff" opacity="0.13"/>
  <circle cx="980" cy="1780" r="250" fill="#fff" opacity="0.12"/>
  <rect x="64" y="64" width="952" height="1792" rx="46" fill="#fffaf4" filter="url(#shadow)"/>

  <rect x="120" y="132" width="840" height="68" rx="34" fill="#e9f5ec"/>
  <circle cx="160" cy="166" r="11" fill="#2e8b57"/>
  <text x="188" y="177" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="1" fill="#246d45">PROJETO DE EXTENSÃO UNIVERSITÁRIA</text>

  <text x="540" y="390" text-anchor="middle" font-family="Fredoka, Nunito, Arial, sans-serif" font-size="122" font-weight="900" fill="#f26b21">PetConecta</text>
  <text x="540" y="458" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="39" font-weight="800" fill="#44352d">Uma rede para proteger e reencontrar.</text>

  <text x="540" y="640" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="62" font-weight="900" fill="#8e3d0c">Perdeu ou encontrou</text>
  <text x="540" y="715" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="62" font-weight="900" fill="#8e3d0c">um pet?</text>
  <text x="540" y="794" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="700" fill="#5b4539">Sua participação pode fazer a diferença.</text>

  <rect x="120" y="892" width="840" height="112" rx="28" fill="#2e8b57"/>
  <text x="540" y="963" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="49" font-weight="900" fill="#fff">TESTE A APLICAÇÃO</text>

  <g transform="translate(240 1080)">
    <rect x="0" y="0" width="600" height="600" rx="28" fill="#fff" stroke="#f2c69f" stroke-width="7"/>
    <image x="28" y="28" width="544" height="544" preserveAspectRatio="xMidYMid meet" href="petconecta-site-qrcode.png"/>
  </g>
  <text x="540" y="1752" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="39" font-weight="900" fill="#246d45">Aponte a câmera para o QR Code</text>
  <text x="540" y="1810" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#44352d">petconecta-db068.web.app</text>
</svg>